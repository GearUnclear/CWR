      - "2026-07-29: two latent test regressions from this landing found and fixed (background session; neither test had actually run green since 92d7426 - the landing sweep only ran the two undercover tests). (1) player_fire_headless: NOT undercover-related despite appearances - the in-game UI's per-frame cursor re-aim (InGameUIMenuSim.cpp SimulateHUD) overwrites the force-fire wanted gun direction back to the level cursor every frame on a manual player, so the scripted `fire` latch starves and the shot never leaves; fixed by making the cursor aim yield while EntityAI::_forceFireWeapon is pending (new GetForceFireWeapon() accessor; cursor aim resumes when the shot consumes the latch). Verified pre-existing at HEAD 56b03f5 with a HEAD-built binary in a clean worktree - the uncommitted #25 engine diff is innocent. (2) showcase_smoke chapter 6: alert.sqs broke cover 150 m out where at WL1 NO garrison group holds a record of the player (payload probe: ucStatus=0, witnesses=0), so gmBreakUndercover marked nobody (silent latch by design) and the FSM never left GREEN; fixed by staging 35 m from a live garrison group and waiting for knowsAbout > 0 before the break (the lifecycle test's proven contract). Chapter 7 fallout: a genuinely-run alert chapter leaves reserve/defender state that can freeze the capture meter past the old 20 s window (z.garrison >= 1 defends; the cache re-materializes leftover reserve); capture.sqs now re-wipes whatever stands back up and gives the first tick the flip's 90 s budget. Final: player_fire + showcase_smoke + guerrilla_native_undercover + guerrilla_undercover_rules green at --retries 0; [guerrilla] unit sweep 2121 assertions and [missions] parity 609 assertions green."
      - "2026-07-22: closed #24. Root cause was subtler than the issue's reading: a side flip through UpdateTarget can never trip the Fail (the hand-back always runs under the OLD stored side before the write); the real hole is that all three exposure hand-back sites (UpdateTarget / DeleteTarget / RemoveOldExposures in AICenterImplPreview.cpp) re-derive the enemy-vs-unknown category from the CURRENT side + friendship matrix. In every guerrilla mission the civilian center boots with military friendships copied from resistance (friends[East]=0 via BeginArcade), its pre-seeded East targets get booked as ENEMY exposure on the first Think, then ZoneRegistry::ApplyCampaignFriendship welds civ-vs-occupier to 1.0 and each held exposure re-derives as neither enemy nor unknown: one Fail('Illegal exposure') per tracked East unit, exposure dropped without dirtying the enemy map (stale contribution). Fix: AITargetInfo now remembers the booked category (_exposureEnemy, set at both AddNewExposures booking sites, reset with _exposure on load) and every hand-back erases with it unconditionally; the erase only dirties cells for RecalculateExposure, which rebuilds from current sides, so the stale contribution is dropped correctly for ANY later side/friendship state. No unit test (AICenter+AIMap need full world scaffolding); verified e2e: [guerrilla] suite 2017 assertions green, Undercover.Abel smoke 92 s ZERO hits + zero [ERRR] (was 10 hits in first 18 s). Commits list not self-updated (a commit cannot contain its own hash); the fix hash is on the #24 closing comment."

