  - id: unassociated-assailants
    title: "Unassociated assailants: civilians who fight back + rogue civilians hostile to both sides (issue #42)"
    phase: phase-2
    status: planned
    priority: 3
    depends_on: [extort-solicit]
    gh_issues: [42]
    summary: >
      Split out of #41 at its own request. Two behaviors: a civilian extorted
      while his fear score is under 20 always fights back rather than paying,
      and, sparingly and at random, civilians go rogue on their own and
      attack the player's side AND the occupier's side. They are not a
      faction - hostile to everyone, loyal to nobody - and exist to carry the
      chaos real insurgencies have.
    log:
      - "2026-08-05: filed. The blocking fact is that ZoneRegistry::ApplyCampaignFriendship (ZoneRegistry.cpp:455-503) welds the civilian center friendly to BOTH war sides and re-applies on every load, under the comment 'the population is nobody's enemy; the ambience layer's civilians are not a third army' - the exact assumption this feature breaks. Friendship is per-CENTER (setFriend / AICenter::SetFriendship), so dropping it would turn every civilian on the island hostile at once, the opposite of 'sparingly'."
      - "Mechanism that does work: unit side comes from the receiving group's AI center on all three creation paths (verified in the #26 pass), so a rogue moves into a group on another center while keeping his civilian class and model - the same class-vs-center split the undercover system already relies on."
      - "The spare side slot must be COMPUTED, not hardcoded to WEST as issue #2 assumes: on vanilla Abel (occupier EAST, resistance GUER) WEST is free, but on Guerrilla.Lebanon80 the IDF occupier IS WEST and Hizballah is EAST, leaving GUER as the only free slot. ResolveSideCollisions already pins both campaign sides and is the natural place to derive the leftover one."
      - "Trap to respect: #24 was caused by exactly this class of change - the three exposure hand-back sites in AICenterImplPreview.cpp re-derive enemy-vs-unknown from the CURRENT side + friendship matrix, so runtime diplomacy strands bookkeeping. Also budget-bound: an AI center carries roughly 63 groups, so rogues must be pooled and reaped, never one group per assailant."

