  - id: extort-solicit
    title: "Solicit/Extort: per-civilian opinion + fear, money taken from the population (issue #41)"
    phase: phase-2
    status: planned
    priority: 3
    depends_on: [civilian-ambience-layer]
    gh_issues: [41]
    summary: >
      The earning half of the money loop, taken off the civilian population
      rather than off zones. Each city carries its existing support score
      (heavily suppressed while the invader holds it); individual civilians
      get a random +/-35 opinion around it plus a random 0-100 fear score.
      An opinion at or above +75 gives a 50% chance of a donation, decaying
      as the player keeps asking and recovering slowly over time; fear at or
      above +65 pays every time but costs that civilian's opinion badly.
      Damaging a civilian's opinion nudges the city's support score, and that
      nudge persists. Performance contract from the issue: these per-civilian
      scores are not computed en masse and only need to stay consistent while
      the player is within 300 m of the city.
    log:
      - "2026-08-05: filed. Complements money-sinks-dealers (spending); this is where the money comes from outside zone income. Both write the same gmResources scalar economy.sqs owns, so the single-writer/directional-split discipline that keeps economy.sqs and recruit.sqs from colliding has to extend to cover it."
      - "The support nudge lands on ZoneRecord::support, the same 0-100 ledger the #8 resentment path already debits - so extortion pressure and occupier atrocity share one currency of town goodwill, which is the intended tension."

