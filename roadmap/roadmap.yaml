    log:
      - "First attempt (5c0fd63) used a dt-scaled flick cap; that WAS the spin/jitter bug. Reworked in 5a289cd as a constant clamp + FPS-independent smoothing."
      - "Known wart: mouse.cfg persists old defaults across the fix; stale configs keep old feel."
      - "f7f9ec4 fixed CreateGameObject linkage (declare in namespace Poseidon)."
      - "2026-07-07 investigation (issue #10): primary suspect is per-count angular quantization (~0.30 deg X / 0.40 deg Y per count, ~7-9 px per count at 1080p; legacy 1/200+1.5 scale calibrated for 400 DPI mice, referenceDpi=1600 default makes dpiNormalize a no-op). Second: on-foot yaw was never made direct (Man::IsVirtualX false for CamInternal, so deadzone-0 only locks dive; yaw = gun-cone float + 32 rad/s body slew stick-slip). Secondary: smoothing filters displacement not rate, ms-quantized AppIdle deltaT, one frame of pump-order latency, FPS-dependent flick clamp."

