  - id: deep-undercover-system
    title: "Deep undercover: per-observer perception, per-group compromise, vehicle disguise policy"
    phase: phase-2
    status: done
    priority: 1
    depends_on: [engine-native-systems, mission-migration-native]
    commits: [92d7426, 283574a, 3eea713, a94430a]
    gh_issues: [19, 20, 21, 22, 23, 24]
    summary: >
      Engine-level undercover replacing the binary global cover break: a
      native UndercoverSystem (Game/Guerrilla/Undercover.{hpp,cpp} +
      UndercoverCommands.cpp) resolves the player's perceived side PER
      OBSERVING GROUP at the three TrackTargets side-resolution sites.
      Person rules: weapon in hands = Suspect/Exposed via sideAccuracy
      boosted x2.0 (war-level scaled off gmWarLevel, existing 1.5 ID
      threshold); slung rifle = Exposed within 20 m, Suspect/Exposed only if
      the back is visible (x1.4); unarmed = civilian unless that group is
      already compromised. Verdicts: TCivilian / TSideUnknown (AI
      investigates) / real side + a permanent serialized per-group
      compromise flag on the Target record (ucCompromised/-Time). Vehicle
      policy: civilian vehicles anonymous; stolen occupier vehicles read
      friendly at range, Suspect at sideAccuracy>=1.35 (vanilla
      stolen-vehicle idiom), Exposed + vehicle-record compromise within
      20 m; a witnessed getaway marks the VEHICLE for those witnesses only.
      The old global vehicle-mount break in AlertMachine is DELETED
      (playerInVehicle input removed); AlertMachine drains a compromise
      queue instead (campaign-first compromise = AEUndercoverBroken +
      alertHeatBreak on the witness's nearest zone; later witnesses =
      undercoverHeatWitness, no event). gmBreakUndercover =
      mark-all-witnesses (zero witnesses = silent latch). New SQF
      gmUndercoverStatus/gmUndercoverWitnesses/gmUndercoverForget; 10 new
      CfgGuerrillaZones undercover* keys; gmUndercoverDetect gone.
      gmUndercover + setCaptive stay the script-owned baseline and are
      never dropped; re-establishment is emergent (stow weapon,
      avoid/eliminate witnesses; suspicion fades ~4 min, compromise is
      per-group permanent by default). SP scope: player subject only,
      self-disables without a real player; system state serializes as an
      "Undercover" subclass under the ZoneRegistry block.
    log:
      - "2026-07-16: engine + scripts + integration tests code-complete in the working tree, NOT yet committed (no hashes yet); integration verification pending. undercover.sqs rewritten in all 7 copies (advisory-only break hint via gmUndercoverWitnesses; captive/gmUndercover never dropped); escalation.sqs lost the dead gmUndercoverDetect + GM_PANIC_DETECT_* tunables; Showcase ticker/alert/status chapters read gmUndercoverStatus/gmUndercoverWitnesses. guerrilla_native_undercover rewritten to the new lifecycle, NEW guerrilla_undercover_rules.test (full_cwa rule matrix), showcase_smoke chapter-6 asserts flipped."
