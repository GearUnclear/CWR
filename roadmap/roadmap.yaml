  - id: wrp-4wvr-object-load
    title: "4WVR/RVW world loader: seekg clears latched EOF (community islands loaded building-less)"
    phase: hardening
    status: done
    depends_on: [build-toolchain]
    commits: [af5b3bb]
    summary: >
      Landscape::LoadData probes every world with WrpReader first (the OPRW
      fast path). A non-OPRW 4WVR/RVW world is parsed to EOF before the probe
      rejects it, and QIStream::seekg only cleared _fail on the rewind, so the
      RVW fallback re-parse inherited the latched _eof: terrain and textures
      loaded, then the object loop broke on its first f.eof() and the world
      came up with ZERO wrp-embedded objects (no buildings, walls or trees on
      any community island, i.e. every @LoBo world). BIS islands are OPRW and
      never hit the fallback, which is why only mod terrains came up bare.
      seekg now clears _eof on a successful seek, matching std::istream
      (C++11) semantics; red/green regression test builds a synthetic RVW v4
      blob and asserts the probe-then-reparse pattern sees the object list.
    log:
      - "Verified against lebanon80.wrp: 81,383 objects, where the loader had been logging 'Total 1 objects, max. id -1'. In-game confirmation followed."
      - "The official CWA Remastered binary shares this code path and the bug (diagnosed from its debug log on a Steam install); filed upstream as draft PR #98 on the CWR-CE community fork, carrying the GearUnclear identity only (no AI attribution on external contributions)."
      - "Unblocked the Lebanon80 template: a 25.6 km @LoBo world is unplayable without its objects."

  - id: mod-prop-spawn-safety
    title: "Third-party prop spawns degrade instead of crashing; mod preload rosters actually merge"
    phase: hardening
    status: done
    depends_on: [wrp-4wvr-object-load]
    commits: ['001b39e']
    summary: >
      createVehicle of @LoBo's static scenery props (wrecks, ruins, sandbags,
      barbed wire, barrels, burning oil wells) took the process down with an
      access violation. Three independent faults, all now non-fatal: a partially
      resolved class loads as a bare EntityAIType and every entity constructor
      static_casts the type to its own subclass (Building::Building sized _locks
      from a garbage NPos() and memmove'd that range); WeaponProxy::IsPresent()
      tested only `selection`, so DrawProxies dereferenced a null loose link; and
      the config plumbing that was supposed to prevent the whole situation was
      dead - ConfigParsers kept only ONE mod's deferred bin/config (and, because
      the mod enumeration runs in reverse mount order, the wrong one), while the
      stock CWA config.bin locks CfgAddons at PAReadOnly so ParamClass::Update
      refused every mod's CfgAddons/PreloadAddons roster silently. The probe now
      runs all 20 candidate props to completion; the five LoBoWreck classes read
      back scope 0 and are refused with a log line instead of a crash. (That last
      part was misread as intent - see lobo-content-repair: the classes were
      finished content behind a missing preprocessor header, and are usable now.)
    log:
      - "The silence was the hard part: ParamClass::Update reports its refusal through AccessDenied -> RptF, and RptF is #define RptF(...) ((void)0). Nothing in any log said the merge had been skipped."
      - "Both config faults hid each other. Fixing the single-slot deferred merge alone changed nothing observable, because CfgAddons was still read-only; the diagnostic that cracked it was a permanent INFO line in World::ActivateAddons reporting active-addon count and how many came from PreloadAddons classes (12 from 3 classes == the base game's own WeaponBIStudio/MiscBIStudio/ResistanceBIStudio and nothing else)."
      - "CfgAddons is lifted only to PAReadAndCreate and only for the duration of a merge, then restored: mods may ADD preload classes, they still cannot rewrite the base game's lists, and the protection shape the MP integrity walk checksums is unchanged."
      - "Access denial does NOT imply an unspawnable class: CheckAccessCreate deliberately continues past a denial, and a denied class whose base is visible still inherits a positive scope (GWRubble builds fine with 'gwbuild1' inactive). The crash needed scope to resolve <= 0, which is what the LoBoWreck classes do."
      - "Behaviour change with a test cost: guerrilla_lobo_body_save_reload phase 02 asserted the @LoBo owners report INACTIVE on a fresh mount as its control. That baseline was recording these two bugs, not a property of mod mounting; the assertion is flipped to true and the control now rests on gmSelPlayerClass/SoldierGB plus the DIFF 3 loadout rebuild."
      - "Fixed a latent dangling pointer alongside: Pars.Update copies array values that keep a _file back-pointer into the source ParamFile, and the deferred configs were freed immediately after. Pars.SetFile(&Pars) after the merge, matching the existing Res handling."
      - "Coverage: unit tests for the registry merge (test_addon_config_merge.cpp) and the proxy/bounds guards (test_house.cpp); integration test scripting/prop_spawn_safety pins all of it on the real Guerrilla.Sinai template, with a @propsafety fixture mod mounted LAST specifically so its roster occupies the slot the single-slot merge used to discard."

  - id: lobo-content-repair
    title: "@LoBo content defects repaired at source (wreck and poster props usable)"
    phase: hardening
    status: done
    depends_on: [mod-prop-spawn-safety]
    commits: [d108433]
    summary: >
      Eighteen finished @LoBo scenery classes could not be spawned at all. The
      cause was a content defect, not an engine one: OFP-era configs write
      `scope = public;` and rely on a five-line `#define private 0 / protected 1
      / public 2` header at the top of the same file, and LoBoWreck.pbo and
      LoBoPalObj.pbo are the only two of @LoBo's 116 addon configs that omit it.
      The bare identifier resolves to nothing, the reader stores the string,
      CfgVehicles reads scope 0, and createVehicle refuses the class with
      "Cannot create '<class>': type is abstract". @LoBo is ours to modify as of
      2026-08-08, so this is fixed in the pbos rather than shimmed: config.cpp is
      stored uncompressed and `scope = 2;` is shorter than every spelling of
      `scope = public;`, so the value is rewritten in place and space-padded back
      to length - no repack, no pbo offset recalculation. tools/lobo/
      fix-lobo-scope.ps1 finds its own targets (any addon that uses a scope
      keyword without defining it), backs originals up to @LoBo/_ud-orig/, and is
      idempotent. The ten LoBoWreck wrecks and the eight LoBoPalObj posters now
      build; probe_props runs 20/20 with zero "type is abstract" lines.
    log:
      - "@LoBo is gitignored as game data, so the repaired pbos exist only on this machine. The script is the tracked artifact - rerun it after any @LoBo reinstall, same contract as gen-patched-pbos.ps1."
      - "The provisional CfgVehicles overlay in tools/screenshots/@udshowcase/bin/config.cpp is removed; it only covered six of the eleven defective sites and would have masked the two LoBoPalObj-side classes forever."
      - "Sweep of all 116 @LoBo addon configs found no other undefined scope keyword and no surviving malformed float. The remaining bare identifiers are destrType = Destruct* in 13 addons that never define them (engine enum: No=0, Building=1, Engine=2, Tree=3, Tent=4, Man=5, Default=6), so they all collapse to DestructNo and those props are indestructible. Left alone deliberately: the numeric mapping is knowable but the mod shipped that way for twenty years, and 'fixing' it is a gameplay change, not a repair. Same for access = ReadOnlyVerified (falls to the more permissive ReadAndWrite) and side = TEast (falls to 0, which IS TEast)."
      - "LoBoWreck.cpp also drops the semicolon after `accuracy=0.3`. Harmless here: ParamClass::Parse terminates a scalar value on any of ';', '\\n', '\\r' (ParamFile.cpp:1797), so the next line still parses. Not touched."
      - "The tracerColor '0.0.1' floats that @lobofixup exists for are already repaired inside @LoBo itself (2026-07-16); @LoBo's LoBoammo.pbo and LoBo_airammo.pbo are byte-identical to the fixture's shadows. The fixture's addons/ shadows are therefore inert, but its bin/config.cpp roster is still load-bearing for the lobo lane, so the fixture stays."
      - "Not fixed here, and NOT a config problem: LoBo_M60A1_wreck and LoBo_M60A1_wreck2 build and draw but sit ~3.4 m below ground at createVehicle height (setPos [x,y,4] seats them). Followed up in lobo-model-origin-repair, where the 4-LODs-vs-7 lead turned out to be a red herring: it is the model's vertical origin, not a missing LOD."
      - "probe_props was reframed while verifying this. Its old vantage looked north through a lobo_israel_w_03 separation-wall segment on the n=9801 line, so every frame was a full-bleed grey slab - a green run that proved nothing. Moved to open ground at [11900, 9650] (no placed object within 70 m, ~450 within 400 m, so unambiguously dry land)."

  - id: lobo-model-origin-repair
    title: "M60A1 wreck props seat on the ground (@LoBo model-origin repair)"
    phase: hardening
    status: done
    depends_on: [lobo-content-repair]
    summary: >
      The follow-up left open by lobo-content-repair. LoBo_M60A1_wreck and
      LoBo_M60A1_wreck2 built, textured and drew perfectly but `createVehicle
      [x, y, 0]` buried them whole - roof 0.45 m and 0.92 m under the sand,
      belly 3.39 m and 3.19 m under - and the probe_props frame for them was
      empty desert. The standing lead was that their p3d carries 4 LODs where
      LoBo_t54wrck carries 7, so they were missing the LOD the engine seats an
      object with. That lead is wrong. All ten LoBoWreck classes derive from
      Camp -> Strategic -> Building -> Static with simulation "house", so they
      are built as `Building` with `_static = true`, and Entity::PlaceOnSurface
      takes its Static branch (World/Simulation/Simul.cpp:1300):
      `pos += orientation * GetShape()->BoundingCenter()`. The LandContact ->
      Geometry -> Level(0) chain that ObjGetPos and the non-static branch use is
      never reached, and no LoBoWreck model has a LandContact LOD anyway
      (landContact = -1 in all ten, including the eight that seat correctly).
      A static prop is seated at terrainY + boundingCenter.Y, i.e. its AUTHORED
      ORIGIN goes on the ground, and both M60A1 models were authored with that
      origin above the mesh. Repaired at source in the p3d: in an ODOL the
      vertices are already stored auto-centred and boundingCenter records where
      the authored origin sits relative to that centre, so rewriting
      boundingCenter.Y is exactly equivalent to having moved the model in O2
      before binarising. tools/lobo/fix-lobo-model-origin.ps1 does it, finds its
      own targets (any auto-centred ODOL whose whole mesh is at or below its own
      origin, which can never seat), and is idempotent.
    log:
      - "Proved from the game rather than from the code: spawning each wreck alone at [11900, 9650] on Sinai, every prop landed at exactly terrainY + its own boundingCenter.Y to within 1 mm (terrain 11.970 m; t54 +0.522 -> 12.492, t55 +1.053 -> 13.023, BTR-60 +0.484 -> 12.454, Ural +1.128 -> 13.098, Sho't +1.379 -> 13.349, M60A1 -1.921 -> 10.050, M60A1_2 -2.057 -> 9.913). Seven models, one formula, no LOD term in it."
      - "After the repair the same probe reads 13.440 and 13.107, putting each model's lowest vertex exactly on the surface. probe_props p03 shows a tank instead of empty desert, and a new p03b covers _wreck2, which nothing exercised before."
      - "getPos is useless as the regression signal here and the obvious assertion would have been vacuous: ObjGetPos re-runs PlaceOnSurface for the readback, so a freshly createVehicle'd static reports z = 0 whether it is on the sand or 3 m under it. prop_spawn_safety CASE 2d instead measures the ASL difference against LoBo_t54wrck spawned at the same point, which is a pure model-to-model constant: +0.95 and +0.62 after the repair, -2.44 and -2.58 before, asserted +/-0.75."
      - "Patch mechanism is four bytes per model, in place: p3ds are stored uncompressed in these pbos and a float replaces a float, so the pbo file table does not move and no repack is involved - same contract as fix-lobo-scope.ps1. The model trailer is not aligned, so the script anchors on the GEOMETRY_SPEC (1e13) resolution float and accepts an offset only when the resolution run, the symmetric auto-centred bounding box, the bounding-sphere radius, the bool fields and the mass-array-to-end-of-file arithmetic all agree. Cross-checked against PoseidonFormats' own reader on all ten LoBoWreck models."
      - "Self-discovery held: a -WhatIf sweep of every p3d in @LoBo read 979 ODOL models in 12 s and flagged exactly the two M60A1 wrecks. 44 models were skipped as unreadable by the anchor heuristic and reported as such rather than guessed at."
      - "@LoBo is gitignored, so the repaired pbo exists only on this machine; the script is the tracked artifact and has to be rerun after any @LoBo reinstall, alongside fix-lobo-scope.ps1."
      - "Observed while verifying, not investigated (out of scope): PoseidonGame sometimes stays alive and idle after a Trident run has finished, including runs the harness reported as passed, and a lingering instance poisons the next connection as 'failed to read from harness (broken pipe?)'. Every game-launching command here appends a Stop-Process kill."

  - id: cam-set-dir-fix
    title: "camSetDir turns the camera again (scripted-camera angle commands)"
    phase: hardening
    status: done
    depends_on: [crash-fixes-trident-trust]
    commits: ['4419c0a']
    summary: >
      The whole scripted-camera angle family was inert. "camSetDir" and
      "camSetBank" were both bound to the CamSetDive handler in the operator
      table (GameStateExt.cpp:1376-1377), so a vanilla OFP cutscene line
      pitched the camera instead of turning it; the correct CamSetDir /
      CamSetBank handlers existed in GameStateExtUi.cpp but had no forward
      declaration and were unreachable. And the commit side was dead too -
      SetDive/SetHeading stored the angle and raised a flag that
      CameraVehicle::Commit never read, orientation coming entirely from the
      camera target. Commit now folds a pending heading/dive pair into a view
      target at virtual infinity (the ResetTargets trick), anchored on the
      committed destination so camSetPos + camSetDir in one commit aims from
      where the camera ends up.
    log:
      - "Angle convention matches getDir: degrees, heading clockwise from north, dive positive up. Dive is clamped just short of the poles because a view direction parallel to VUp degenerates SetDirectionAndUp."
      - "camSetBank is correctly routed now but still does nothing, deliberately and with a note at CameraHold.hpp:69: target-derived orientation forces up = VUp, so roll has nowhere to go until that path takes an up vector. Accepted-and-ignored beats accepted-and-mis-applied."
      - "Found while building the screenshot shoots, which routed around it with triSetView; the README for those still recommends triSetView, because it takes an absolute eye point and look direction in one call with no commit step."
      - "Covered by rendering/cam_set_dir_heading: two opposite headings, getDir asserted at 90 and 270, plus a pixel-change assertion - under the alias the two frames were identical, so a getDir-only test would have passed on the broken build."

