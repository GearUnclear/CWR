  - id: faction-island-decoupling
    title: "Faction/island decoupling: any faction on any island + faction-pack mod contract (issue #26)"
    phase: phase-2
    status: planned
    priority: 2
    depends_on: [faction-swap-either-side, faction-class-resolution, character-outfit-select]
    gh_issues: [26]
    summary: >
      CfgGuerrillaFactions is authored per island template, so the cyclers
      only offer what that island ships (no IDF on Abel, no vanilla Soviets
      on Sinai). The engine machinery for cross-faction play already exists
      (side-follows-group weld, resistance side pin + sideTwin/rebase,
      plan-15 fallback ladders, the OutfitSelect player seam). Remaining
      work, per issue #26: (1) union-merge global Pars + island
      description.ext factions (island wins on name collision) in the three
      consumers (GuerrillaNewGame, ZoneRegistry, OutfitSelect) and move the
      vanilla + LoBo blocks to the shared location; (2) menu-time
      ParsClassProbe gating so factions whose classes are absent from the
      loaded data are hidden/greyed instead of degrading to fallback bodies;
      (3) extend the OutfitSelect seam to substitute playerClassWarrior when
      the selected resistance differs from the template default (today only
      the CIVILIAN outfit substitutes); (4) descriptor completeness +
      sideTwin authoring per faction plus a PoseidonTools lint that reports
      unresolvable keys per data package; (5) island x faction matrix tests
      in the full_cwa/lobo lanes + e2e gating assertions; (6) a published
      faction-pack spec: a mod ships CfgGuerrillaFactions subclasses in its
      addon config.cpp and appears in the cyclers on every island with zero
      engine/template changes. Mod ISLANDS (auto-generating a
      Guerrilla.<island> template per world) are explicitly out of scope.
    log:
      - "2026-07-29: filed as issue #26 after a cross-issue discovery pass (#2/#13/#16/#25 + tree verification). Key finding: sides and rosters are already fully decoupled in-engine; the weld is content packaging (per-island faction blocks), not engine capability."

