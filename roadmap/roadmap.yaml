  - id: startup-stall-diagnosis
    title: "Intermittent zero-CPU startup stall before harness listen (issue #30)"
    phase: hardening
    status: in-progress
    priority: 1
    depends_on: [build-toolchain]
    commits: [97a02eb]
    gh_issues: [30]
    summary: >
      Intermittent multi-minute stalls during PoseidonGame startup under tri:
      the process parks at ZERO CPU between the last line of
      InitializeSubsystems ("ScenePreloader initialized") and
      CreateGameHarness, then either wakes and passes normally (observed at
      180.7 s, 486 s, 487 s) or gets externally killed. Normal time-to-harness
      on this machine is 2-3 s. The window's real content is StartGameMode ->
      World::StartIntro -> StartRandomCutscene (the menu-world load). Leading
      hypothesis is a vsync-blocked SDL_GL_SwapWindow during that load
      (SwapInterval(1) armed at EngineGL33.cpp:404, reached via I_AM_ALIVE ->
      ProgressSystem::Frame), which is zero-CPU by construction and fits the
      "always happened unattended" pattern.
    log:
      - "2026-08-04: mitigations landed (97a02eb) but NOT the root cause. The window had no log statements at all, and tri discarded every pre-harness stdout line that was not HARNESS_PORT= (~29 KB of startup logging thrown away per run). Now: LOG_INFO phase boundaries bracket the window, and tri writes pre-harness stdout to game_stdout.log flushed per line, so the next natural occurrence names its own guilty phase."
      - "The exactly-180-seconds figure is a red herring: no 180-second constant exists in the engine, and tri did not abort the instance that woke at 180.7 s. Kill-predecessor / parallel-contention was tested as a trigger across ~35 relaunches and did not reproduce; contended startup is CPU-busy, not parked."
      - "Operational hazard found during diagnosis: the documented blanket cleanup 'Get-Process PoseidonGame | Stop-Process -Force' kills OTHER runners' instances mid-test (the known exit -1 / empty-stderr signature). Cleanup should be scoped to owned PIDs."

