      click path from the booted menu.
    log:
      - "2026-07-30: launch chain proven live by tri probes: click idc 124 -> IDD_MISSION (46), alive player, UC_BOOTED, gmZoneIndex Houdan >= 0. First e2e attempts were an environment goose chase: concurrent Claude sessions kill every PoseidonGame process as test cleanup (bare menu canary died at 25s; exit code -1, empty stderr, no WER = external TerminateProcess), and their parallel game instances slow world loads past the 240s timeout."
      - "2026-07-30: both e2e tests green 2/2 after appending triEndTest (menu-launch tests idle in-mission after the last assert; without the shutdown verb the runner waits out the full timeout and reports 'game didn't exit cleanly'). On a quiet machine with hot caches the whole menu boot -> click -> mission-init chain completes in ~1 s (mission init.sqs and ZoneRegistry run during the load, before the first rendered frame), so sub-second green runs are genuine, not false passes - verified against the runner's RUST_LOG=debug eval trace."

