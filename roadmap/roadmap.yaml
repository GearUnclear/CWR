  - id: vehicle-controls-overhaul
    title: "Vehicle controls: mouse steering removed, permanent freelook in non-turret seats, gamepad-steering option"
    phase: phase-2
    status: in-progress
    priority: 2
    summary: >
      Design decision (2026-08-09): the mouse never steers a vehicle in UD -
      in every non-turret seat (Driver, CommanderAsDriver, Cargo; turret
      Gunner/Commander seats keep mouse aim) the camera is permanently
      decoupled from the hull, mouse looks and keys steer, on the ground and
      in the air alike. Implemented as a seat-driven freelook lock:
      World::UpdateInputContext feeds InputContextResolution.seat into
      InputSubsystem::SetSeatFreelookLock, IsLookAroundEnabled() ORs the
      manual LAlt/toggle flag with the lock, and the joystick-recency
      arbiter deliberately keeps reading only the manual flag so an idle
      connected pad cannot win steering during a drive. The
      internalCamera+IsMouseTurnActive mouse branches were deleted from all
      seven pilots (Car, Motorcycle, Tank, Ship, HelicopterAI, AirplaneAI,
      SeaGull). Keyboard steering retuned asymmetrically instead of a flat
      scalar: centering (_turnDecreaseSpeed) now matches the retired mouse
      path's 2.0 flat (self-stabilizing, kills the release/counter-steer
      oscillation), wind-up stays speed-scheduled and was settled by playtest
      just above vanilla (car 0.53->0.16 across the speed range, bike with the
      maxTurn floor kept at the raised 0.1), tank command authority 0.36 rad
      at rest with the vanilla lookahead estT 0.25. New persisted Options
      toggle "Gamepad steering" (gamepad.cfg steering=, GamepadTuningPage row
      1): off = IsJoystickPilotActive/IsJoystickThrustActive false and
      stick/trigger/POV bindings stripped from movement actions in the five
      driver contexts, while pad look/buttons/menus stay live.
    log:
      - "2026-08-09: landed engine-side. Unit coverage: seat-lock semantics, mouse-turn veto, arbiter-on-manual-flag, pilot/thrust gating, driver-context binding suppression, gamepad.cfg round-trip, tuning-page rows. PoseidonTests at baseline (5 pre-existing Map-localization reds, reproduced with the change stashed); clean boot to main loop verified. Steering strings added to the Classic package's local bin/STRINGTABLE_OPTIONS.utf8.csv (gitignored data-dir file - re-add after a reinstall) + the tracked test fixture."
      - "2026-08-21 (aaadfd7): in-vehicle feel playtest done for car/bike/tank on a DriveTest.Abel mission (jeep + M60 beside spawn, in the gitignored Classic Missions dir). Every 08-09 wind-up rate turned in too hot; live-iterated with the player to car slowTurn*0.37+0.16, bike *0.37+0.12 (centering 2.0 kept - vanilla's slow centering was also test-driven and rejected), tank authority 0.36 rad at rest (~72% of vanilla; the retune's 0.75 AND pure vanilla 0.5 both felt too fast) with vanilla estT 0.25."
      - "Open: keys-only aircraft flight feel playtest; a tri lane asserting mouse motion moves the camera but not _turnWanted."

