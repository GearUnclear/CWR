  - id: guerrilla-journal
    title: "Field journal: native Notes/Plan pages (manual, live situation, diary, objectives)"
    phase: phase-2
    status: done
    depends_on: [engine-native-systems, mission-migration-native, arms-stash-engine]
    summary: >
      The map screen's briefing notepad was empty in Guerrilla Mode (no
      briefing.html, nothing written at runtime). Now a native Journal
      (engine/Poseidon/Game/Guerrilla/Journal.* + JournalCommands.cpp: gmJournalLog /
      gmJournalObjective / gmJournalStatus / gmJournalCount / gmJournalEntry /
      gmJournalObjectiveState / gmJournalStatusText, plus the gmIslandName nular)
      holds a capped diary, keyed objectives and keyed status lines, serialized as
      the presence-tolerant GuerrillaJournal save block. UI/Guerrilla/
      GuerrillaJournalPages.* renders, inside DisplayMap::ReloadBriefingContent
      whenever CfgGuerrillaZones is active, the Notes page (campaign header, a live
      Situation block from ZoneRegistry/AlertMachine/UndercoverSystem/StashRegistry +
      the script economy globals, a 10-topic field manual on GM_MAN_* pages, latest
      diary lines + a full GM_LOG page) and the Plan page (standing goal, two
      engine-computed objectives with counts, scripted objectives, derived next
      steps). Pages rebuild on every map-key open (DisplayMap::ResetHUD; the display is
      created once per mission), on any journal change while open (revision
      compare in OnSimulate), on the Notes/Plan tab press and after an in-place
      load. The shared
      scripts (byte-identical across all 8 mission copies) write the diary (capture
      arc, QRF, cover blown, promotions/deaths, unlocks, War Level edges, recruits,
      save/restore), four starter objectives and the Companions / Unlocked-gear
      status lines; init.sqs is unchanged.
    log:
      - "2026-08-22: `Journal::Log` had to be renamed AddEntry (Log is an engine macro). AddImage needs a texture loader, so the renderer takes useImages=false in the parser-only unit test and draws text bullets; in-game it reuses the stock mission_dot/done/uncomplete icons. GetHtmlText joins fields with a space while the formatter lays them adjacent, so the test helper collapses double spaces."
      - "2026-08-22: verified: [guerrilla] unit lane 2710 assertions/128 cases green incl. the script-core parity test and test_journal.cpp (6 cases); Trident guerrilla_native_capture + guerrilla_native_save_reload.seq (extended with diary/objective/status sentinels across the cross-process reload) 2/2 green; install-missions.ps1 -IncludeWorld Sinai,Lebanon80 rerun. Stale ccache PCH objects (CRLF-era cache hits after the LF normalisation) had to be force-rebuilt with CCACHE_DISABLE=1 before anything compiled."

