    log:
      - "2026-08-07: #46 - the silent-selection-drop audit of the menu-to-mission seam. Seven seams triaged against the tree; three changed behaviour, three got diagnostics or comments, one was audited and deliberately left alone. (1) HEADLINE: ApplyPlayerOutfitSelection returned early unless BOTH CfgGuerrillaZones and CfgGuerrillaFactions resolved, with no log line, while a body pick reads NEITHER (ResolvePlayerBodyClass probes CfgVehicles only) and neither does #45's addon activation - so a template authoring one block and not the other discarded every pick on a mission-author typo. Gate removed; the pending selection is now the 'is this Guerrilla' signal, which is safe because every ordinary launch path runs GStats.ClearAll() before publishing (verified at OptionsUIApp 489/640/738/862/945/2198), so the campaign bank cannot leak a stale pick into a non-Guerrilla mission. Proven by a red/green cycle on a half-authored Guerrilla.Abel (installed description.ext stripped of CfgGuerrillaFactions): gate present -> typeOf player == authored SoldierGB; gate removed -> SoldierWB, with the substitution INFO in the log. (2) SEAM 4 turned out to be far worse than the audit's 'offered then unrenderable': pointing playerClassCiv at the shapeless base class Man ACCESS-VIOLATES the process in Man::Init -> ReactToDammage -> EntityAI::GetHit inside CreateVehicle. VehicleTypes' own shapeless guard misses it (it tests for an empty model STRING; this class names a .p3d the package does not ship, and ShapeBank answers with an empty LODShape, not a null). New PlayerBodyModelIssue mirrors the menu roster's GetShapeName + FileExist gate at the seam and the caller now DECLINES the substitution, keeping the authored class - the file's standing never-a-substitute contract, not an exception to it, and unreachable for a CHARACTER pick because that roster is built behind the same gate. Crash reproduced, then reproduced as a clean logged decline. (3) Previously-silent degrades of an explicit CIVILIAN pick now WARN on every rung (no factions block, no faction resolved, no playerClassCiv key), and the failed-pick WARN now names the outfit token it is ALSO dropping. (4) SEAM 6 (island switch drops a live outfit token, one-way: keep is re-derived from the emptied list, so a round trip reopens on WARRIOR) kept as-is on the grounds that it is the same island-scoped re-seed contract the occupier/resistance cyclers follow, but it now WARNs; observed firing in-game on an Abel -> Cain switch. (5) SEAM 2 got the comment the issue asked for, naming SwitchLandscape -> CleanUpDeinit -> GGameState.Reset() as what destroys the VarSet half and the AddVariable mirror as the load-bearing one (wipe chain verified line by line). (6) SEAM 5 (GModeArcade gate) LEFT ALONE, and the issue's premise corrected: --test-mission is GModeArcade, not a skipped mode (StartAutoTest passes GModeArcade whenever the mission has groups) - it ignores selections because nothing publishes and StartAutoTest has no campaign-bank replay; MP never publishes gmSel* either (NGSLoadIsland replays only param1/param2), so removing the gate would change nothing while enabling substitution in menu cutscenes. (7) SEAM 7 (double-click re-seed) LEFT ALONE: the stricmp guard is correct and load-bearing; two comment corrections added (the name-keep now recovers the faction pair, so what the guard still buys is PBO churn plus the one selection the name-keep cannot recover, and the case it protects most often is the repeat SINGLE click). Verification: ctest units 3713/3713 (3 new), guerrilla ui e2e 7/7 green twice including both LoBo lanes, which is the evidence the new mission-time shape probe does not falsely reject modded bodies. Honest gap: the three civilian-ladder WARNs and the no-player-unit WARN are unreachable through the shipped UI (they only fire when menu-time and mission-time config diverge, which is what they exist to diagnose), so they are proven by unit-test path execution plus the two sibling WARNs of identical form observed rendering in-game, not by direct observation."
      - "2026-08-07: #47 - the OUTFIT cycler stopped advertising a scope it had lost. A CHARACTER pick beats the token for the PLAYER body unconditionally (ResolvePlayerBodyClass returns on the pick and never falls through, not even when the picked class fails the probe), but idc 153 kept reading 'OUTFIT: CIVILIAN' after the pick, so the screen promised a civilian body it would not deliver - the player spawned as the picked WEST rifleman leading a plainclothes squad. Fixed the LABEL, not the precedence: while a pick is live the row renders 'OUTFIT (squad only): <token>'. Rejected greying idc 153 (the issue's own first suggestion) on two grounds - the token still genuinely governs recruits/companions/hold via GM_OUTFIT_CIV, so a disabled control would be the opposite lie and would strand the player with no way to dress their fighters; and CActiveText::OnLButtonUp does not consult IsEnabled while triClick bypasses the container hit-test entirely, so a 'disabled' cycler would still cycle under the harness and under any synthetic event. Qualifier goes in the PREFIX, not appended, so the empty-roster case reads 'OUTFIT (squad only): (mission default)' instead of stacking two parentheticals. Wiring: keyed on SelectedPlayerClass() (the exact value published as gmSelPlayerClass, so label and precedence cannot drift), re-rendered from both _bodySel writers - OnChildDestroyed and RevalidateBodySelection, the latter mattering because a pick the package no longer resolves drops to -1 and HANDS the player body back to the token. New ui/guerrilla_outfit_scope_label_e2e drives the whole state machine (default -> CIVILIAN -> pick -> qualifier -> cycler still enabled and still cycling -> island round trip -> clear back to '(match outfit)' -> qualifier gone -> re-pick -> launch) and was proven red against the pre-fix engine with exactly the reported text ('CHARACTER: Soldier || OUTFIT: CIVILIAN'). Full guerrilla ui e2e set 7/7 green, ctest units 3710/3710."
      - "2026-08-05: BODY browser landed (916c273) - player-body pick from ANY side the package ships. Roster rule: GuerrillaListPlayerBodies (Man-derived, scope>0, sides 0..3, shape-probe gated, deduped by displayName+model, capped 24/side, WEST/EAST/GUER/CIV in config scan order; Classic yields SoldierWB as entry 0, which the e2e pins). gmSelPlayerClass rides the gmSelOutfit publish+persistence pattern; pick beats token, probe failure keeps the authored class (never the token body); untouched browser publishes nothing (asserted from both sides: new guerrilla_player_body_e2e + a nil assert added to the outfit e2e). Same commit fixes the mannequin wearing rifle+RPG+pistol at once: GuerrillaPreviewHideWeaponProxy classifies proxies by their CfgNonAIVehicles simulation (proxysecweapon/proxyhandgun hide, proxyweapon draws; dalekohled/binoc/nvg stems as mod belt-and-braces since Classic ships no such classes and those proxies never even instantiate). New save/reload seq proves the cross-side body + gmSelPlayerClass survive a cross-process reload. Test-fixture gotcha documented: ParamClass::Add resolves through the base chain, so own entries must be added BEFORE SetBase or they overwrite the base's values. Accepted emergent gameplay documented (OutfitSelect header + ARCHITECTURE.md A.5): occupier-roster bodies read as occupier at distance via the vanilla side-resolve ladder; undercover untouched."
      - "2026-07-29: implemented M1+M2+M3(1,3,4,5)+M5 in one session. Unit tests: test_outfit_select.cpp (resolver precedence, probe-failure keeps authored class, civTier ladder + clamp, Civ-scalar plan-15 degrade) + GuerrillaOutfitChoices cases in test_guerrilla_module.cpp; [guerrilla] sweep 2121 assertions / 103 cases green. Integration: guerrilla_outfit_civilian_e2e (menu->Abel->CIVILIAN->typeOf player==SoldierGFakeC + manager class globals), guerrilla_civ_disguise_fire (M3.3: CIV read at 150 m via knownTargets - first consumer of that command - ID at 15 m, fire-exposure flip on a second still-distant group), guerrilla_lobo_terror_spawn (M2.4 Terror EventHandler smoke), sinai e2e extended with the outfit cycler + WARRIOR no-op assertions."
      - "Design calls made in-session (documented in the issue): publish tokens WARRIOR/CIVILIAN (case-insensitive engine compare); outfit offered per RESISTANCE block (cycling resistance re-derives the pair, pick preserved by name); Civ scalars degrade to warrior fallback while civTier[] gets the civilian-outfit ladder; presence policy = include."
      - "2026-07-30: closing pass for #25 - M2.3 integration coverage landed (the one gap a code-only audit found): guerrilla_native.abel fixture now authors the Civ key family; the civilian e2e proves REAL companion/recruit/specialist spawns (not just folded globals); new guerrilla_outfit_hold_spawn pins the capture.sqs gmFactionSquad-bypass monoculture (first cut re-ran the full garrison-clear+secure arc and was flaky on AI-spotting variance - rewrote as a deterministic consumer-side test, the flip->event production stays owned by guerrilla_native_capture); new guerrilla_outfit_save_reload.seq proves the substituted player body + gmSelOutfit + folded globals survive a cross-process save/reload via the real menu path. Also posted a correction on #25: the landing comment's 'M3.2 needs no new code' claim is false - GarrisonCache::SpawnGarrison only consults FactionTierClass/FactionSquad, nothing native consumes FactionCivTierClass, so garrison use of the civTier[] rung is real #16 work. Rider: guerrilla_new_game_e2e was caught deterministically red - its occupier-cycler asserts still assumed the pre-1702080 two-entry global @lobofixup roster, but the menu has listed the island template's own factions since the plan-16 landing (Sinai = 8 entries, two clicks land on EgyptArmy not back on IDF); fixed by pinning the real eight-entry ring, so the ff5ff41 landing comment's green claim for this test was inaccurate."
      - "2026-08-05: M4 preview visual-artifact pass (843d9e3) - in-game screenshots of d1d2e12 caught two proxy artifacts the raw Object::DrawProxies path leaks: the weapon-proxy models' zasleh muzzle-flash sections are authored visible (in-mission Man::DrawProxies substitutes the real weapon and re-hides zasleh per frame, a pass the UI render never runs) and the flag_vojak shoulder proxy is hard-textured with a default US flag only in-mission flag-carrier machinery may rebind. Fix in GuerrillaOutfitPreview: SetModel hides the zasleh section on the body and every proxy shape (persistent per-shape not-firing state), and a DrawProxies override skips flag proxies entirely (GuerrillaPreviewIsFlagProxy, flag/vlajka stems - NO flag is the only faction-safe rendering; side-matched flags stay out of scope). Verified by before/after screenshots on both bodies at three turntable angles; [Guerrilla] 2151/107 + [outfit] 70/15 green, both UI e2e green (2/2, 15.0s). Root-cause tooling note: PoseidonTools pbo extract + model inspect -s on Data3D.pbo gave the proxy ground truth (ak_47_v58_proxy/rpg7_proxy/flag_vojak/beretta/nvg_proxy/dalekohled_proxy roster, usa_vlajka.pac default texture)."
      - "2026-08-04: M4 preview polish landed (d1d2e12) - option analysis picked live 3D over baked PAA portraits (zero art assets, per-island correctness for free): GuerrillaOutfitPreview, a ControlObject subclass on GuerrillaNewGame (CT_OBJECT idc 154; 152 town / 153 outfit discipline kept), resolves playerClassWarrior/playerClassCiv -> CfgVehicles model -> shape-file probe and hides on any missing rung; bounding-box fit + OnSimulate turntable (CHead pattern). Unit: 3 new preview test cases ([outfit] 59 assertions / 14 cases green, [Guerrilla] 2140 assertions / 106 cases). e2e: outfit_civilian_e2e extended with triGetControlVisible-154 for both bodies, green alongside an unmodified guerrilla_new_game_e2e (2/2, 14.7s). Gotcha: tri treats a .test.toml PATH argument as the script itself (exit 2 in about a second, quoting the toml's own comment line) - pass the .test.sqf or the directory. OPEN eyeball items: base-pose acceptability (no UI control animates a Man skeleton) and slot placement vs the notebook at z=2.0 camera-space."

  - id: character-select-screen
    title: "Character select screen: uncapped mod-aware roster browser with 3D mannequin (issue #43)"
    phase: phase-2
    status: done
    priority: 2
    depends_on: [character-outfit-select]
    commits: ["6352291"]
    gh_issues: [43, 45, 48, 50, 51]
    summary: >
      Issue #43 (BODY-picker follow-up to #25): the flat idc-155 cycler is
      replaced by a proper character-select child display in the new-game
      flow. Idc 155 becomes the CHARACTER entry button; clicking it opens
      GuerrillaCharacterSelect (IDD 77): scrollable CListBox roster (idc
      160) grouped by side with dimmed header rows and a "(match outfit)"
      row 0, large turntable mannequin (161, the shared GuerrillaBodyPreview
      factored out of GuerrillaNewGame), side/class/addon-source info line
      (162, ParamEntry::GetOwner attribution), CONFIRM/BACK cloned from the
      menu Quit class. Engine-synthesized config with an
      RscDisplayGuerrillaCharacterSelect override hook. All three #43
      defects fixed: kGuerrillaMaxBodiesPerSide deleted (every deduped,
      probe-passing Man class enumerates; lobo lane 1541 rows, IDF WEST
      families reachable, LoBoGolaniWB launch proven end to end), labels
      show displayName with hyphen-sanitized classnames as fallback (the
      menu fonts drop the underscore glyph), and CIV-side bodies preview
      unarmed (GuerrillaPreviewHideWeaponProxy civilian flag). The pick
      returns to the parent via OnChildDestroyed; gmSelPlayerClass publish
      semantics and the untouched-flow invariant are byte-identical to the
      cycler era. Harness: triLB* listbox primitives + a generalized
      case-insensitive triSelectListByData, rows carry classnames as data.
    log:
      - "2026-08-05: landed (6352291). Verification: [Guerrilla] 2263/116 + [outfit] 180/24 unit green; 6/6 affected integration tests green twice (full_cwa + lobo, zero retries); new ui/guerrilla_character_lobo_e2e pins LoBoGolaniWB (row 287 of 1541) reachable and launching with gmSelPlayerClass == typeOf player; 4 read-verified screenshots on both lanes (armed Golani preview, unarmed LoBo-Civ-01, post-CONFIRM parent label). Classic nuance: Abel's uncapped roster is 96 rows, BELOW the old 101-row theoretical ceiling, so the uncapping proof lives in the lobo assert. Known cosmetic follow-up outside this screen: island-list annotation text clips at the notebook edge."
      - "2026-08-07: issue #45 fixed - a CHARACTER body picked on one island launched on another with its owner addon never activated (repro: Sinai -> pick lobogolaniw -> switch to Abel -> OK; three 'Access denied' WARNs for lobois/loboweapons/loboweapnad plus an on-screen IDS_MSG_ADDON_MISSING per denial, the unit spawning anyway because CheckAccessCreate returns true unconditionally). Root cause is NOT island-staleness alone: the roster is package-wide by design (built once from Pars >> CfgVehicles), so ANY template whose mission.sqm addOns[] does not name the picked body's addon hits this, island switch or not. Fix is therefore engine-side, not data-side: new additive World::ActivateAddon/IsAddonActive (ActivateAddons is a whole-list reset), and OutfitSelect::CollectPlayerBodyAddons walks the picked class's owner + its weapons[]/magazines[] owners + those weapons' magazines[] owners and activates the closure from ApplyPlayerOutfitSelection, which runs inside InitVehicles after ActivateAddons has reset the list and before any unit is created. Deliberately rejected: adding addOns[] to Guerrilla.Abel (listing @LoBo owners in a vanilla template makes CheckPatch fill missingAddOns and Serialize return LSNoAddOn, hard-breaking stock installs) and per-island roster filtering (would undo #43's uncapped roster). GuerrillaNewGame::RevalidateBodySelection now runs at the end of RefreshFactionsForIsland: the pick is KEPT (package-wide roster), but the idc-155 label and mannequin are re-rendered every island change so the button can never promise a body the launch will not deliver. Verification: ui/guerrilla_island_switch_stale_body_e2e rewritten to the fixed behaviour and proven red-against-old-code by disabling only the activation block (test failed on the new triAddonActive assert, false||false||false, and the log showed exactly the 3 documented Access denied lines); with the fix the log has ZERO Access denied and logs the activated closure. 6/6 guerrilla ui e2e green, PoseidonTests 2364/2364, 2 read-verified screenshots (Abel selected with the Golani pick kept; in-mission on Abel holding the LoBo M4A1 with JAM 5.56, no warning box). New harness command triAddonActive reads the same list World::CheckAddon consults. Adversarial pass caught one more hole and it is fixed: RetryMission and the debriefing RESTART button re-run ActivateAddons (clearing) then InitVehicles WITHOUT re-parsing the mission, so on the second pass newClass already equalled uInfo->vehicle and the old early-out skipped the activation, bringing the denials back on every retry - the activation now sits outside the rewrite branch and runs whenever the class resolves (ActivateAddon is idempotent). Known accepted limits: the grant is pbo-wide, not per-class (ParamOwnerList's granularity, not ours), and MP is unaffected because the seam is GModeArcade-only."
      - "2026-08-07: issue #48 coverage-gap pass - the model-persistence audit's six greens were all one island, one descriptor and ~10 frames deep, and this closes the gaps it listed. GAP 1 (Lebanon80 never launched, RefreshOutfitChoices civilian-drop never reached): both closed by the new ui/guerrilla_lebanon80_civilian_e2e, which drives the real menu through Lebanon80 -> CIVILIAN -> Abel -> Cain -> Abel -> Lebanon80 -> launch. Corrections to the issue's premise: Lebanon80 DOES author playerClassCiv (Hizballah -> LoBo_Terror_01E), so it is a positive case, not the drop case; the drop needs an island with no Guerrilla template at all (Cain/Eden/Everon/Intro - there is no Guerrilla.Cain in the tree, which is what #46 actually observed), or a resistance cycled to a faction lacking the key. Substitution proven in-mission on the modded template (LoBo_HizballahRifle4 -> LoBo_Terror_01E, side EAST, loboterror active, screenshot read) - the descriptor-sourced civilian body needs no #45 runtime grant because its owner is already in the template addOns[]. The one-way token loss (Cain then back to Abel reopens on WARRIOR) is now pinned so changing it is deliberate. GAP 2 (save/reload 'never touched') was already substantially covered: guerrilla_outfit_save_reload.seq and guerrilla_player_body_save_reload.seq shipped in 6352291 and both pass. What was genuinely uncovered is #45's own flagged second-order risk, and it turned out to be a live defect - filed as #51 and fixed. GAP 3 (longer horizon) closed by holding both new tests past init-script completion, zone seed, outfit fold, a live native garrison spawn and several hundred further frames before re-reading typeOf/side player; respawn is not a vector at all, every Guerrilla template ships respawn = 0. GAP 4: the CHARACTER button's silent no-op is unreachable with any usable data package (_bodies comes from process-global Pars >> CfgVehicles and is empty only with no CfgVehicles or no Man base class - both already unit-covered - and CanBuild() is false only in a run with no menu resources, where the e2e set proves it true); the double-click seam was left alone per #46's triage and not redone. NEW DEFECTS, both found here, both fixed with red/green proof: #50 (the island-switch faction name-keep ran through GuerrillaIndexOfSelection's SIDE rung, so Abel's class literally named EAST aliased onto Lebanon80's Hizballah - its defaultResistance - and the screen opened on occupier == resistance with the authored defaultOccupier discarded; Abel -> Sinai the same shape, EgyptFrontier as occupier and Jordan as resistance, which then emptied the outfit pair as collateral) and #51 (World::Serialize restores the savegame's addon list on the first load pass, then ParseMission -> CheckPatch -> ActivateAddons resets it 165 lines later, so a reloaded mod body kept its class but lost #45's visibility grant - the unit survived because SerializeVehicles runs before the reset, which is exactly why asserting only typeOf player missed it). Verification: guerrilla UI e2e 8/8, all four save/reload seqs 4/4, five guerrilla scripting tests 5/5, ctest 3714/3714. Honest gaps left open: the OutfitSelect one-block-authored early return still needs a synthesized fixture, the ZoneRegistry-vs-GuerrillaNewGame probe disagreement still has no class that passes one and fails the other, and a modded save loaded WITHOUT @LoBo is still unmeasured."
      - "2026-08-05: live-playtest defect fixed - the new-game island picker would not wheel-scroll (character roster scrolled fine), so modded rosters (11 worlds vs 5 visible rows) left islands unreachable. Root cause: the island C3DListBox sits inside the laptop prop's ControlObjectContainer, whose OnMouseZChanged only relays the wheel while its _indexMove hover latch points at a child; on a missed latch the delta died in ControlObject's no-op. Fix: GuerrillaNewGame::OnSimulate drains the wheel ahead of Display::OnSimulate and drives the list directly (the OptionsScrollList::PollWheelScroll precedent). New ui/guerrilla_island_scroll_e2e (triCursorScroll + new triLBTopRow getter) pins it; 4/4 sibling menu e2es + 3144 unit tests green."

  - id: faction-island-decoupling
    title: "Faction/island decoupling: any faction on any island + faction-pack mod contract (issue #26)"
    phase: phase-2
    status: planned
    priority: 2
    depends_on: [faction-swap-either-side, faction-class-resolution, character-outfit-select]
    gh_issues: [26]
    summary: >
      CfgGuerrillaFactions is authored per island template, so the cyclers
      only offer what that island ships (no IDF on Abel, no vanilla Soviets
      on Sinai). The engine machinery for cross-faction play already exists
      (side-follows-group weld, resistance side pin + sideTwin/rebase,
      plan-15 fallback ladders, the OutfitSelect player seam). Remaining
      work, per issue #26: (1) union-merge global Pars + island
      description.ext factions (island wins on name collision) in the three
      consumers (GuerrillaNewGame, ZoneRegistry, OutfitSelect) and move the
      vanilla + LoBo blocks to the shared location; (2) menu-time
      ParsClassProbe gating so factions whose classes are absent from the
      loaded data are hidden/greyed instead of degrading to fallback bodies;
      (3) extend the OutfitSelect seam to substitute playerClassWarrior when
      the selected resistance differs from the template default (today only
      the CIVILIAN outfit substitutes); (4) descriptor completeness +
      sideTwin authoring per faction plus a PoseidonTools lint that reports
      unresolvable keys per data package; (5) island x faction matrix tests
      in the full_cwa/lobo lanes + e2e gating assertions; (6) a published
      faction-pack spec: a mod ships CfgGuerrillaFactions subclasses in its
      addon config.cpp and appears in the cyclers on every island with zero
      engine/template changes. Mod ISLANDS (auto-generating a
      Guerrilla.<island> template per world) are explicitly out of scope.
    log:
      - "2026-07-29: filed as issue #26 after a cross-issue discovery pass (#2/#13/#16/#25 + tree verification). Key finding: sides and rosters are already fully decoupled in-engine; the weld is content packaging (per-island faction blocks), not engine capability."

