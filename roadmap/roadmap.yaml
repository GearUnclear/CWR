      - "2026-07-21 (later): landed as 92d7426. Post-landing fragility review verdict: robust skeleton (fast gate, pure tested rules, backward-compatible serialization), fragility concentrated where the system meets vanilla perception and the alert FSM. Seams filed as fork issues: #19 one-shot break latch (never re-arms since gmUndercover never drops; first shot marks all knowing groups, later shots mark nobody via the break path), #20 ApplyVerdict refreshes sideAccuracy every seen tick so the record never fades while visible (pins knowsAbout / YELLOW disengage), #21 no threshold hysteresis (suspect/civil flicker at the back-arc / notice-radius / accuracy boundaries), #22 vehicle policy has no e2e integration test (getaway/checkpoint/stolen-vehicle adapter path unit-tested only), #23 hardening backlog (frame-order gate contract, hardcoded 1.35, ManPos default partition, gmUndercover GameBool strictness, FindTarget/FindTargetAll asymmetry). An undercover field-manual page for site/ (undercover.html + uc-*.jpg + gameplay.html edit) is in the working tree from a concurrent session, deliberately NOT committed here."
      - "2026-07-21: BOTH integration tests green on full CWA data (guerrilla_native_undercover + guerrilla_undercover_rules, tri --retries 0, 2/2 twice; TEMP diagnostics stripped from Undercover.cpp before the final run; ctest Undercover/AlertMachine 21/21). Two engine fixes came out of verification: the undercover resolve now runs EVERY processed TrackTargets tick (outside vanilla's accuracy-improvement gate) using effAccuracy = max(sensor, faded record) and returns without touching the record on unseen ticks (visibility < undercoverMinVisibility) unless already compromised; and in-hands pose classification requires a carried weapon (a bare in-hands ManPos no longer counts). Staging lessons: anchor observers with disableAI MOVE + stop true (danger-mode bounding closed 40 m to 20 m otherwise); stage on probe-verified DRY open ground - an object-free nearestObjects disc is NOT a land check (the sea east of the Camp is object-free, swimmers drop rifles, and the Camp zone centre [7600,5700] itself is open water; getPosASL immediately after setPos reads true elevation, sea surface = 1.09) - both tests now stage at [7500,5700] elev 9 with the observer west up an open slope; and knowsAbout measures identification CONFIDENCE, not hostility (a clear-LOS observer confidently IDs an unarmed subject as civilian), so the clean phases assert status/witness counts instead of knowsAbout bands."
      - "2026-07-21 (later): closed #22 - guerrilla_undercover_vehicle.test (full_cwa, guerrilla_native.abel) exercises the vehicle adapter path e2e (b89470a). One reused East observer, three phases reset with gmUndercoverForget: (A) unarmed in a CIVILIAN Skoda at 15 m stays anonymous (status 0, 0 witnesses); (B) stolen EAST UAZ at 60 m not exposed (status < 2), closed to 15 m reads status 2 + witness >= 1 + campaign-first alertHeatBreak spike (>= +20 on the witness zone); (C) rifle-in-hands person ID at 15 m then board a CIVILIAN car inside the 10 s window - the getaway rule marks the car compromised (fresh undercoverHeatWitness spike >= +5 on top of the settled person spike; phase A is the clean same-hull/same-range control). Vehicle-cache lifecycle covered by waiting `(vehicle player) != player` after each moveInDriver and deleteVehicle-to-dismount. Passes 2x --retries 0 at ~91 s; siblings still 2/2. Design note: long-range phase B asserts the safe lower bound status < 2 (0 or 1) rather than pinning the vanilla-idiom Suspect at sideAccuracy>=1.35, which is timing-dependent headless. No engine changes; dist/ binary current for 92d7426."
