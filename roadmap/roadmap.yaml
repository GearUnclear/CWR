      class-driven BODY browser answers the issue's open fixed-tokens-vs-
      class-vocabulary question for the PLAYER BODY - a fifth cycler (idc
      155) enumerates every creatable Man-derived class of the loaded
      package by side (WEST/EAST/GUER/CIV) and publishes gmSelPlayerClass,
