# Uslu dur! internal roadmap - SOURCE OF TRUTH (machine parsable).
# Edit this file; roadmap/index.html and status.json are generated from it by
# roadmap/generate.py (run on every commit via .githooks/post-commit).
# Format rules: see roadmap/README.md. Statuses: done | in-progress | planned | blocked.
# GH issue numbers refer to the fork GearUnclear/CWR (NOT upstream Bohemia).

meta:
  project: "Uslu dur! (UD)"
  repo: GearUnclear/CWR
  trunk_branch: guerrilla-mode   # fork main sits untouched at 366f95f; guerrilla-mode is the de-facto trunk
  grounded: 2026-07-06           # date of the full-repo audit that seeded this file

phases:
  - name: foundation
    title: "Foundation (repo, toolchain, tooling)"
    goal: "Buildable engine, verified test rig, version-controlled site, dev ergonomics."
  - name: phase-1
    title: "Phase 1: native Guerrilla engine systems"
    goal: "The six issue #1 rewrite targets: zones, garrisons, alerts, persistence, evaluator QoL, game module + new-game UI."
  - name: phase-1.5
    title: "Phase 1.5: swappable factions and islands"
    goal: "Same script core on any island with any occupier faction, selected at new-game. Proven on Sinai + IDF."
  - name: hardening
    title: "Engine hardening and test trust"
    goal: "Crashes fixed with red/green regression proof; the test harness cannot lie."
  - name: phase-2
    title: "Phase 2: vertical slice (occupation layer + AI overhaul)"
    goal: "Civilians, pseudo-gangs, occupier teeth, economy depth, tactical-AI feel work."
  - name: phase-3
    title: "Phase 3: full mode"
    goal: "Full island, full occupier playbook, GuerrillaDisplay strategy screen."
  - name: housekeeping
    title: "Housekeeping and follow-ups"
    goal: "Tracker hygiene, deferred cleanups, known-edge decisions."

