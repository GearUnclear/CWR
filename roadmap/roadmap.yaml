  - id: cache-and-garage
    title: "HQ cache + vehicle garage: stored weapons, lockable vehicles, dealer delivery (issue #28)"
    phase: phase-2
    status: done
    priority: 2
    depends_on: [guerrilla-base, arms-stash-engine]
    gh_issues: [28]
    summary: >
      The elected headquarters becomes a physical logistics hub. Weapons and
      vehicles bought from dealers can be shipped to it and retrieved through
      the action menu; the player can deposit weapons into the cache the same
      way. Vehicles parked within 100 m of the garage can be locked (with a
      beep-beep lock cue) and persist indefinitely, which is the intended
      route for banking captured occupier vehicles. Moving the HQ later costs
      money. HQ siting prefers a suitable enterable building and falls back to
      the town edge, outside buildings and fences, when none is found.
    log:
      - "2026-08-05: filed. The weapons half rides the existing StashRegistry pattern (keep-when-empty holders + serialized rows). The vehicle half has no precedent in Game/Guerrilla/ - garrison units ride the world vehicle serializer, but nothing today protects an arbitrary player-parked vehicle from cleanup, so expect a new registry in the StashRegistry/TownFlags mold plus a SaveVersion bump."
      - "2026-08-22: LANDED with #16 M1/M4 and #27 in one commit. Engine: GuerrillaBase owns the cache (a keep-when-empty WeaponHolder registered as a stash, moved with its contents on a re-establish) and the garage ring (gmGarageLock: SetLock + allowDammage false, both re-asserted every 2 s tick and on the load pass since neither is serialized - no SaveVersion bump needed, the block is presence-tolerant; rows release beyond 1.5x the ring; the horn muzzle plays the beep-beep as two OpenAndPlayOnce bursts). User decisions: HQ election = BOTH the new-game START TOWN cycler and the in-mission Establish/Move action; garaged vehicles ARE invulnerable while locked (garageInvulnerable=1). Script: scripts/market.sqs mounts the HQ / Stash / Lock-Unlock / Buy menus and is the second gmResources debit writer. Retrieval from the cache = the holder's own TAKE actions (script fallback documented in market.sqs)."

