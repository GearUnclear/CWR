  - id: dual-package-compat
    title: "Dual-package compatibility: Classic 1.99 + Demo [Remaster] data (issues #11-#15)"
    phase: hardening
    status: in-progress
    priority: 1
    depends_on: [build-toolchain, crash-fixes-trident-trust]
    gh_issues: [11, 12, 13, 14, 15]
    summary: >
      Research and harden the engine + Guerrilla Mode to run on BOTH data
      packages: the original 1.99 full install ("[Classic]") and the official
      remaster Demo package ("Demo [Remaster]", added 2026-07-07). Root theme:
      the remaster engine reads a data-side contract (Bin/remaster.bin config,
      resource-extra UI overlays, marker-texture conventions) that 1.99 data
      lacks; missing entries fail silently. Postmortem case: the glass-marker
      texture null made every bullet-vs-person hit classify as shoot-through
      glass, so projectiles did no real damage (fixed engine-side with 3 new
      Trident regression tests). Full three-agent audit recorded in #13;
      remaining work is its checklist: rename/path fixes (#12), RscOptionsShell
      guard, CfgPreloadTextures shim backfill from 1.99 Data.pbo, Demo-package
      posture for the missing SoldierG* roster, demo-tag and dual --data-dir
      test lanes, install-missions world-gate for the Worlds-less Demo layout.
    log:
      - "Glass bug arc (2026-07-07): play report 'we can't hurt each other' -> point_blank_damage repro failed 4/4 -> bullet telemetry showed collisions with zero HIT dispatch -> GPreloadedTextures.New(TextureBlack) null vs null face textures -> fix: missing glass texture = glass detection off (Shots.cpp, VehicleAICombat.cpp CalculateLaser). Fix + tests pending commit."
      - "Naive damage asserts (>0.01) false-passed on glass-path component chip damage; regression tests now require >0.35. Also learned: SQF 'fire' force-fires skyward by design (dir[1]=10, AimWeaponForceFire), so it cannot drive aimed-damage tests."
      - "Audit headline (#13): Demo CONFIG.BIN ships NO SoldierG*/GUER roster (guerrilla-side spawns are Classic-only until per-package faction descriptors); RscOptionsShell loads unguarded so Options is blank on Classic; every CfgPreloadTextures asset needed for shim backfill exists in 1.99 Data.pbo; demo.wrp is byte-identical to abel.wrp; engine sweep found no further glass-pattern comparisons; two latent crash shapes flagged (CollisionStar std::exit(1), unguarded GScene->Preloaded consumers)."
      - "Data dirs renamed with [brackets] (#12): all configured paths broken (OFPR_DATA_DIR, run-game.ps1, install-missions.ps1, .gitignore/.ignore no longer match -> ~1GB game data un-ignored); brackets are wildcard metacharacters in PowerShell and gitignore globs, so fixes need -LiteralPath/escaping, or bracket-less renames."
      - "Doc gaps filed (2026-07-07): #14 stale 'no Demo dataset on this machine' claims (CLAUDE.md:133, guerrilla README) tell sessions Demo-lane tests can't run when they now can; #15 CLAUDE.md layout docs have no entry for either data package (Demo's data/contract/reference-binary roles + read-only touch policy live only in issue bodies). Both blocked by #12 path fixes; co-land with them."
      - "#12 Option A landed (2026-07-08): kept the bracket names, fixed every configured path instead of re-renaming. .trident.env + run-game.ps1/install-missions.ps1 defaults now point at '[Classic]'; audited PS cmdlets for the bracket-glob hazard (Test-Path/Remove-Item already -LiteralPath; swapped New-Item -Path -> [IO.Directory]::CreateDirectory so the [Classic] parent isn't globbed); .gitignore/.ignore now carry escaped \\[Classic\\]/\\[Remaster\\] entries for BOTH dirs (git status quiet again, git check-ignore positive); six doc references + the sinai_swap test comment path-swapped. Option B (bracket-less re-rename) left to the maintainer."
      - "#14 docs closed (2026-07-08): corrected the stale 'no Demo dataset' test-runnability claims. IMPORTANT nuance found by live verification - #14's premise that the Demo-lane tests 'now run' is WRONG. The Demo [Remaster] package supplies demo.wrp but not the GUER roster (SoldierGB player + resistance garrisons), so a `tri --data-dir` run of guerrilla_capture_flip boot-fails on SoldierGB (strict-mode-fatal, harness closed, ~60ms). They stay unrunnable on both local packages until this item's 'missing SoldierG* posture' checklist lands (a per-package faction descriptor mapping the resistance onto Demo's EAST/WEST classes, or the missions' Gate-Zero class substitution). The 'add demo tag + dual --data-dir lanes' checklist item should note this roster blocker: tagging alone won't make them pass on Demo data."
      - "#15 package docs closed (2026-07-08): both game-data packages now documented in root CLAUDE.md (two-package layout bullets + touch policy) and arma_CWR/CLAUDE.md (:47 Game-data subsection naming both, the Demo's three data/contract/reference-binary roles, lane mapping, bracket -LiteralPath hazard). Noted for the record: #15's premise that root CLAUDE.md:18 still names the dead 'ARMA Cold War Assault/' path was already stale - #12 had renamed it to '[Classic]'."

