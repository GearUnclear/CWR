name: Lobo offline repairs

on:
  pull_request:
    paths:
      - 'arma_CWR/tools/lobo/repair/**'
      - 'arma_CWR/tools/lobo/*_lobo.py'
      - 'arma_CWR/tests/ci/test_lobo_*.py'
      - '.github/workflows/lobo-repair.yml'
  push:
    branches: [main, guerrilla-mode, 'codex/lobo-*']
    paths:
      - 'arma_CWR/tools/lobo/repair/**'
      - 'arma_CWR/tools/lobo/*_lobo.py'
      - 'arma_CWR/tests/ci/test_lobo_*.py'
      - '.github/workflows/lobo-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic repairs (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repairs and transactions without game data
        run: python -m unittest discover -s arma_CWR/tests/ci -p 'test_lobo_*.py' -v
