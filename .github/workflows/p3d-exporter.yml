name: P3D exporter

on:
  pull_request:
    paths:
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/mlod_writer.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_io.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_engine.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_rig.py'
      - 'arma_CWR/tests/ci/test_rtm_*.py'
      - 'arma_CWR/tests/ci/test_p3d_*.py'
      - '.github/workflows/p3d-exporter.yml'
  push:
    branches: [main]
    paths:
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/mlod_writer.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_io.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_engine.py'
      - 'arma_CWR/apps/tools/BlenderAddon/io_import_p3d/rtm_rig.py'
      - 'arma_CWR/tests/ci/test_rtm_*.py'
      - 'arma_CWR/tests/ci/test_p3d_*.py'
      - '.github/workflows/p3d-exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer:
    name: MLOD writer round trip (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write and re-read MLOD P3D files without Blender or game data
        run: python -m unittest discover -s arma_CWR/tests/ci -p 'test_p3d_*.py' -v
      - name: Write and re-read RTM animations, engine playback math, rig derivation
        run: python -m unittest discover -s arma_CWR/tests/ci -p 'test_rtm_*.py' -v
