# Remastered lighting capture run, Sinai with @LoBo mounted. A photo
# generator, not a regression test; run it with run-captures.ps1 (README.md
# beside this file).
#
# No data_dir pin: run-captures.ps1 passes --data-dir (a per-run junction to the
# Remaster shadow), so parallel runs can each clean up only their own games.
# `--mods-dir .` resolves against the game's working directory (the shadow),
# so this mounts the shadow's own @LoBo copy, exactly as the remaster_ud
# Sinai tests do (tests/integration/ui/remaster/*sinai_lobo*). That copy
# carries the mod doctor repairs (_ud-orig present).
binary = "PoseidonGame"
mission = "tests/rendering/captures/missions/udcap_sinai.Sinai"
tags = ["lighting_capture", "lobo", "headful", "exclusive"]
# Loading @LoBo plus the Sinai world is slow.
timeout = 900
assert_timeout = 240
# --no-strict: @LoBo's legacy pbos log ERROR-level noise that is fatal under
# the runner's default --strict.
extra_args = ["--no-strict", "--mods-dir", ".", "--mod", "@LoBo", "--display-mode", "windowed", "--width", "960", "--height", "640"]
