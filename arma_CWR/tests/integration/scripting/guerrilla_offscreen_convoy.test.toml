# Off-screen contract scenario (c), issue #71. Full Remaster lane: data_dir
# "packages/RemasterUD" is a gitignored junction to a setup-prepared shadow of
# the Steam Remastered folder (tools/runtime/new-remaster-shadow.ps1, then
# setup-guerrilla.ps1 in Remaster mode; see guerrilla-mode/FULL-SCALE-SESSION.md).
# Without the junction the test reports spawn failed, which is not a regression.
tags = ["scripting", "guerrilla", "remaster_ud", "offscreen", "headless"]
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
mission = "tests/integration/missions/guerrilla_offscreen.abel"
# zone tick 3 s, cache pass 5 s; RED -> GREEN after a 30 s ambush floor, the QRF stand-down, a return
timeout = 600
assert_timeout = 240
extra_args = ["--dev"]
