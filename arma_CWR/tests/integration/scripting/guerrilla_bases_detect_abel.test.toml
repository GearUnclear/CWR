# Occupation-network detection (issue #76), Abel: the authored Airfield,
# Le Port Harbour and Southeast Compound win, nothing is seeded, and the
# detector's dry run (gmDetectedBases) calls the runway and the Le Port quay
# covered. Boots the SHIPPED Guerrilla.Abel template (repo-root-relative) on
# the full Remaster lane: data_dir "packages/RemasterUD" is a gitignored
# junction to a setup-prepared shadow of the Steam Remastered folder
# (tools/runtime/new-remaster-shadow.ps1, then setup-guerrilla.ps1; see
# guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current gmcore
# (guerrilla-mode/install-missions.ps1). The .sqf header states the ground
# truth it asserts.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "headless", "occupierforces", "bases"]
timeout = 240
assert_timeout = 60
extra_args = ["--dev"]
