# Town defenders, town retake and the D1 player-presence rule (issue #79 B2 +
# D1). Boots the SHIPPED Guerrilla.Abel template (repo-root-relative) on the
# full Remaster lane: data_dir "packages/RemasterUD" is a gitignored junction to
# a setup-prepared shadow of the Steam Remastered folder
# (tools/runtime/new-remaster-shadow.ps1, then setup-guerrilla.ps1 in Remaster
# mode; see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current
# gmcore (guerrilla-mode/install-missions.ps1). Without the junction the test
# reports spawn failed, which is not a regression.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "headless"]
# zone tick 3 s, cache pass 5 s; the rise from ~20 to 60 is 8 ticks, the
# retake drain from up to 100 is 9 ticks
timeout = 420
assert_timeout = 150
extra_args = ["--dev"]
