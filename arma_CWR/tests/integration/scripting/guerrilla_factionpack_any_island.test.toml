# The synthetic faction pack on Abel (issue #54 E2). The pack is a repo
# fixture mounted by an absolute ${repo_root}/... path (tri expands the
# token to the engine checkout root), so it needs no @LoBo and no patched
# pbos. Needs the shared core + faction library installed
# (guerrilla-mode/install-missions.ps1), like every Guerrilla test.
mission = "tests/integration/missions/guerrilla_factionpack.abel"
binary = "PoseidonGame"
tags = ["scripting", "guerrilla", "full_cwa", "headless"]
timeout = 300
assert_timeout = 180
extra_args = ["--dev", "--mods-dir", ".", "--mod", "${repo_root}/tests/fixtures/mods-factionpack/@udfaction"]
