# Ambient traffic held to the live-AI budget (round 3 A, OFFSCREEN-CONTRACT.md
# section 6). Boots the SHIPPED Guerrilla.Abel template (repo-root-relative)
# on the full Remaster lane: data_dir "packages/RemasterUD" is a gitignored
# junction to a setup-prepared shadow of the Steam Remastered folder
# (tools/runtime/new-remaster-shadow.ps1, then setup-guerrilla.ps1 in Remaster
# mode; see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the
# current gmcore (guerrilla-mode/install-missions.ps1). Without the junction
# the test reports spawn failed, which is not a regression.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "headless", "traffic", "offscreen"]
# traffic pass tuned to 1 s; the warm-up waits for two ambient spawns, the
# budget watch is 120 s of game time, the resume waits for one more spawn
timeout = 600
assert_timeout = 240
extra_args = ["--dev"]
