# Mounts the @badmodel addon fixture (a CfgVehicles class with model="") and
# loads a mission, so the test can createVehicle the empty-model class.
# tri expands ${repo_root} to the engine checkout root (arma_CWR).
binary = "PoseidonGame"
mission = "tests/integration/missions/action_menu_weapon.Demo"
extra_args = ["--mods-dir", "${repo_root}/tests/fixtures/mods-badmodel", "--mod", "@badmodel", "--no-strict"]
timeout = 60
tags = ["headless"]
