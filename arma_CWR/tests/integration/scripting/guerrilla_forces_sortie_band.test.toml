# Occupier forces, a sortie does not demote the band (OCCUPIER-FORCES.md 5.6
# "The band's input"; owner decision 6 of 2026-10-16): an airframe out is
# committed, not spent, so a strike whose price would take the pool under
# STRONG keeps the band STRONG for its whole sortie. Boots the SHIPPED
# Guerrilla.Abel template (repo-root-relative; occupierForces = 1) on the full
# Remaster lane: data_dir "packages/RemasterUD" is a gitignored junction to a
# setup-prepared shadow of the Steam Remastered folder (see
# guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current gmcore
# and faction library (guerrilla-mode/install-missions.ps1): EAST's forcesJet
# / forcesAttackHeli keys make the strike airframe. Without the junction the
# test reports spawn failed, which is not a regression. Not headless.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
timeout = 900
assert_timeout = 420
extra_args = ["--dev"]
