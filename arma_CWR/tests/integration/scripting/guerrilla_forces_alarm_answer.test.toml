# Occupier forces phase 6B, the native alarm answer and the legacy QRF gate
# (OCCUPIER-FORCES.md 8.2, D20; 12.2). Boots the SHIPPED Guerrilla.Abel
# template (repo-root-relative; it opts in with occupierForces = 1) on the
# full Remaster lane: data_dir "packages/RemasterUD" is a gitignored junction
# to a setup-prepared shadow of the Steam Remastered folder (see
# guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current gmcore
# (guerrilla-mode/install-missions.ps1). Without the junction the test
# reports spawn failed, which is not a regression. Not headless: the
# answering force is born under the real-camera gates (gmTrafficPercept).
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
timeout = 900
assert_timeout = 420
extra_args = ["--dev"]
