# Occupier forces phase 1 A (2026-10-16, video 5): massing instead of
# trickling. An escalated need above every base's spare holds the director's
# token until a base can staff it (OCCUPIER-FORCES.md 6.3 MASSING). Boots the
# SHIPPED Guerrilla.Abel template (repo-root-relative; it opts in with
# occupierForces = 1) on the full Remaster lane: data_dir "packages/RemasterUD"
# is a gitignored junction to a setup-prepared shadow of the Steam Remastered
# folder (see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the
# current gmcore (guerrilla-mode/install-missions.ps1). Without the junction the
# test reports spawn failed, which is not a regression. The operation is
# asserted at its launch (gmOccupierOps), before any birth.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "headless", "occupierforces", "counterattack"]
timeout = 720
assert_timeout = 300
extra_args = ["--dev"]
