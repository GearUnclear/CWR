# Occupier forces, the air re-plan as one ledger movement (OCCUPIER-FORCES.md
# 3.1 step 4, 5.5, 5.6): a watched truck column re-planned as a Mi17 insertion
# must not flip the pool band between the airframe's debit and the ground
# hull's refund. Boots the SHIPPED Guerrilla.Abel template (repo-root-relative)
# on the full Remaster lane: data_dir "packages/RemasterUD" is a gitignored
# junction to a setup-prepared shadow of the Steam Remastered folder
# (tools/runtime/new-remaster-shadow.ps1, then setup-guerrilla.ps1 in Remaster
# mode; see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current
# gmcore (guerrilla-mode/install-missions.ps1). Without the junction the test
# reports spawn failed, which is not a regression.
# Not headless: the birth gate needs a real camera.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
# the deferral waits out a 20 s give-up, then the re-plan; no flight is waited
timeout = 900
assert_timeout = 600
extra_args = ["--dev"]
