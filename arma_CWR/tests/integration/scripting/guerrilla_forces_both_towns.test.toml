# Occupier forces director, both towns (OCCUPIER-FORCES.md phase 3, native
# OccupierForces + CounterAttack). Boots the SHIPPED Guerrilla.Abel template
# (repo-root-relative; it opts in with occupierForces = 1) on the full
# Remaster lane: data_dir "packages/RemasterUD" is a gitignored junction to a
# setup-prepared shadow of the Steam Remastered folder
# (tools/runtime/new-remaster-shadow.ps1, then setup-guerrilla.ps1 in
# Remaster mode; see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry
# the current gmcore (guerrilla-mode/install-missions.ps1). Without the
# junction the test reports spawn failed, which is not a regression.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "headless", "occupierforces"]
# two remote rises (support 55 to 60: one or two 3 s zone ticks each, plus the
# cache passes that store both garrisons), then director ticks at 1 s
timeout = 360
assert_timeout = 120
extra_args = ["--dev"]
