# Boots the real Guerrilla.Lebanon80 template (repo-root-relative) on the
# @LoBo mod's Lebanon (80's) world. Requires the FULL CWA install
# (OFPR_DATA_DIR) plus the @LoBo mod folder next to it: --mods-dir ".."
# resolves relative to the game CWD (the data dir, D:\Arma_CWA\ARMA Cold War
# Assault [Classic]), so "@LoBo" mounts D:\Arma_CWA\@LoBo.
#
# SINCE ISSUE #56 TASK 2 the lane mounts @LoBo ALONE: no @lobofixup fixture.
# The three jobs the fixture used to do are all covered at source now:
#   * the eight war rosters live in @LoBo\bin\config.cpp, written by
#     tools/lobo/install-lobo-factions.ps1 from the tracked
#     guerrilla-mode/config/lobo-factions.hpp (issue #54 A4 moved them out of
#     the templates; without that install the campaign boots side-less);
#   * the malformed tracerColor floats are coerced by the config reader
#     (issue #54 D1) and repaired in place by `mod doctor --fix`;
#   * the LoBo addons the template spawns from are activated by the
#     transitive addon walk (issue #54 C1), so no preload roster is needed.
# So this run is also the standing proof of C1 and D1: if either regresses,
# this is the lane that goes red.
#
# PRECONDITIONS (one-time, rerun after an @LoBo reinstall):
#   tools/lobo/install-lobo-factions.ps1
#   PoseidonTools mod doctor D:\Arma_CWA\@LoBo --fix
#   guerrilla-mode/install-missions.ps1
mission = "guerrilla-mode/mission/Guerrilla.Lebanon80"
binary = "PoseidonGame"
tags = ["scripting", "guerrilla", "full_cwa", "lobo", "headless"]
# @LoBo is 600+ MB of legacy pbos that log ERROR-level noise (missing crew
# anims in CoC pbos etc.) - fatal under the runner's default --strict, so
# this test opts out. Script errors still hard-abort via the --autotest path.
# First boot scans/mounts everything and the 25.6 km Lebanon80 world load is
# slow - generous budgets on purpose (same as guerrilla_sinai_swap).
timeout = 420
assert_timeout = 240
extra_args = ["--dev", "--no-strict", "--mods-dir", "..", "--mod", "@LoBo"]
