# Occupier forces phase 6B, a town strike (OCCUPIER-FORCES.md 7.3, D17, D18,
# D21; 12.2). Boots the SHIPPED Guerrilla.Abel template (repo-root-relative;
# it opts in with occupierForces = 1) on the full Remaster lane: data_dir
# "packages/RemasterUD" is a gitignored junction to a setup-prepared shadow of
# the Steam Remastered folder (see guerrilla-mode/FRESH-INSTALL.md). The
# shadow must carry the current gmcore and faction library
# (guerrilla-mode/install-missions.ps1): EAST's forcesJet / forcesAttackHeli
# keys are what make a strike airframe available. Without the junction the
# test reports spawn failed, which is not a regression.
# Not headless: the airframe's birth and removal gates need a real camera.
# Tag slow_air: a real sortie from the Airfield to a town. Tri has no
# per-test default exclusion, so a default run passes --skip-tag slow_air;
# run this lane with --tag slow_air --retries 3.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "slow_air"]
timeout = 900
assert_timeout = 480
extra_args = ["--dev"]
