# Occupier forces: an operation on a held base whose cell and hold squad are
# gone arrives ABSTRACT and retakes it through occCapture (OCCUPIER-FORCES.md
# 7.2, contract row 2c: a live fight only against live defenders). Boots the
# SHIPPED Guerrilla.Abel template (repo-root-relative; it opts in with
# occupierForces = 1) on the full Remaster lane: data_dir "packages/RemasterUD"
# is a gitignored junction to a setup-prepared shadow of the Steam Remastered
# folder (see guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the
# current gmcore (guerrilla-mode/install-missions.ps1). Without the junction
# the test reports spawn failed, which is not a regression. Not headless: the
# birth gate needs a real camera (gmTrafficPercept).
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
timeout = 900
assert_timeout = 420
extra_args = ["--dev"]
