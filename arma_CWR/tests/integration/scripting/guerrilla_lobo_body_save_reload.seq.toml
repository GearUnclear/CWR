# A MOD-OWNED player body across save/reload, including the runtime addon
# grant (issue #48 gap 2, and the second-order risk issue #45 flagged and left
# unverified).
#
# The sibling guerrilla_player_body_save_reload.seq already round-trips a
# base-game cross-side pick (SoldierWB on Abel). What it cannot reach is the
# case #45 created: a body whose owner addon is NOT in the template's addOns[]
# and is only visible because ApplyPlayerOutfitSelection additively granted it
# at InitVehicles. That grant lives in World::_activeAddons, and a savegame
# both writes that list (WorldImpl.cpp, "addons") and re-activates it on load -
# so the claim under test is that the grant survives a genuine cross-process
# save/reload, and that the unit rebuilds from the serialized class rather than
# from the vanilla template manifest.
#
# The baseline in phase 02 is what makes the round-trip mean anything: the same
# process, same mods, freshly launched on untouched Abel, reports the authored
# SoldierGB and a nil gmSelPlayerClass, so nothing can false-pass on leftover
# state in the shared user dir. (Until 2026-08 that baseline also reported the
# @LoBo owners INACTIVE; it no longer does, because @lobofixup's
# CfgAddons/PreloadAddons roster now actually reaches World::ActivateAddons -
# see the note in 02_reload.test.sqf.)
#
# PRECONDITIONS: guerrilla-mode/install-missions.ps1 (no -IncludeWorld
# since issue #54 C4); the one-time @lobofixup patched pbos
# (tests/fixtures/mods-lobo/@lobofixup/gen-patched-pbos.ps1). Full CWA 1.99 +
# @LoBo only.
