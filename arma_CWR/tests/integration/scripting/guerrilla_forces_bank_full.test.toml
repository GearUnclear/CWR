# Occupier forces, the ceiling drops only when every base is full
# (OCCUPIER-FORCES.md 5.5 "The ceiling", owner decision 2026-10-16): with
# every occupier base pinned at its garrisonMax, a strike airframe home to a
# full pool has nowhere to bank and its units are dropped. The companion of
# guerrilla_forces_bank_garrison. Boots the SHIPPED Guerrilla.Abel template
# (repo-root-relative; it opts in with occupierForces = 1) on the full
# Remaster lane: data_dir "packages/RemasterUD" is a gitignored junction to a
# setup-prepared shadow of the Steam Remastered folder (see
# guerrilla-mode/FRESH-INSTALL.md). The shadow must carry the current gmcore
# and faction library (guerrilla-mode/install-missions.ps1). Without the
# junction the test reports spawn failed, which is not a regression. Not
# headless: the real-camera assert of the opener tests is kept.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
timeout = 900
assert_timeout = 420
extra_args = ["--dev"]
