# Occupier forces, the air rule of the package choice: an empty Goisse gets a truck, Goisse with three fighters reported gets a helicopter insertion, the Southeast Compound (an island) still flies (OCCUPIER-FORCES.md 6.5; phase 1 C, 2026-10-16). Not headless: the forces are born under S (a real camera).
# Boots the SHIPPED Guerrilla.Abel template (repo-root-relative; it opts in
# with occupierForces = 1) on the full Remaster lane: data_dir
# "packages/RemasterUD" is a gitignored junction to a setup-prepared shadow of
# the Steam Remastered folder (see guerrilla-mode/FRESH-INSTALL.md). The
# shadow must carry the current gmcore (guerrilla-mode/install-missions.ps1).
# Without the junction the test reports spawn failed, which is not a
# regression.
mission = "guerrilla-mode/mission/Guerrilla.Abel"
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["scripting", "guerrilla", "remaster_ud", "occupierforces", "counterattack"]
timeout = 1200
assert_timeout = 600
extra_args = ["--dev"]
