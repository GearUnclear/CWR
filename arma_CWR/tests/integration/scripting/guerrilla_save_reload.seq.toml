# Guerrilla Mode - save/reload round-trip (NATIVE engine surface).
# Demo-data twin of guerrilla_native_save_reload.seq (full-CWA/Abel).
#
# Master config for the .seq/ directory. Its ordered phases (01_save, 02_reload)
# each launch the game fresh but share one POSEIDON_USER_DIR, so the binary save
# 01 writes with triSaveGame (UserDir/Saved/Tmp/grr.fps) is the one 02 restores
# with triLoadGame - a genuine cross-process round-trip of the SQF global state
# (GGameState) AND the native guerrilla subsystems (ZoneRegistry / AlertMachine /
# GarrisonCache::Serialize, including the registered event handlers).
