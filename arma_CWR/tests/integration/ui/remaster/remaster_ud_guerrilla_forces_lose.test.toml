# REMASTER LANE (issue #67): see remaster_ud_guerrilla_abel.test.toml for how
# packages/RemasterUD is built. Without the junction the test reports spawn
# failed, which is not a regression.
# Campaign lose end screen (OCCUPIER-FORCES.md 9.2, D10, D13; occupier forces
# phase 4 part B): GUERRILLA -> Abel with the "(camp)" default (the HQ is
# established at the Camp), the Camp handed to the occupier so nothing is
# held, the HQ destroyed through the gmHqForceCapture lever, the end clock
# runs out (EMLoser), the stock debriefing shows the UD lose text, and
# Continue (OutroLoose) returns to the main menu. no_autotest: under
# --autotest a mission end quits the game instead of showing the debriefing
# (same opt-out as remaster_ud_guerrilla_abel_win_screen).
# --focus: a menu-launched session (no --test-mission) pauses when another
# window takes focus, and the end clock runs on simulation time.
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
no_autotest = true
tags = ["ui", "guerrilla", "remaster_ud", "occupierforces", "headless"]
timeout = 300
assert_timeout = 180
extra_args = ["--dev", "--focus"]
