# REMASTER LANE (issue #67): UD installed BESIDE Bohemia's files on the full
# official Remaster. data_dir "packages/RemasterUD" is a gitignored junction to a
# SHADOW of the Steam Remastered folder (never the Steam install itself), built
# and prepared once with:
#   pwsh -File tools/runtime/new-remaster-shadow.ps1 -Source <Remastered> `
#        -Destination <shadow> -LoBoSource <Remastered>/@LoBo
#   pwsh -File setup-guerrilla.ps1 -GameDir <shadow> -LoBoDir <shadow>/@LoBo `
#        -Tools <dist>/PoseidonTools.exe
#   cmd /c mklink /J packages\RemasterUD <shadow>
# See guerrilla-mode/FRESH-INSTALL.md. Without the junction the test reports
# spawn failed, which is not a regression.
# GUERRILLA -> Abel -> launch, no mod mounted: the installed Guerrilla.Abel
# template and gmcore boot on Remaster data.
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
tags = ["ui", "guerrilla", "remaster_ud", "headless"]
timeout = 300
assert_timeout = 180
extra_args = ["--dev"]
