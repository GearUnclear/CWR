# REMASTER LANE (issue #67): see remaster_ud_guerrilla_abel.test.toml for how
# packages/RemasterUD is built. Without the junction the test reports spawn
# failed, which is not a regression.
# Campaign win end screen (issue #79 B3): GUERRILLA -> Abel, every enemy
# military zone flipped, the end clock runs out, the stock debriefing shows
# the UD win text, and Continue returns to the main menu. no_autotest: under
# --autotest an END1 quits the game instead of showing the debriefing (same
# opt-out as ui/debriefing/campaign_result_current_section).
# --focus: a menu-launched session (no --test-mission) pauses when another
# window takes focus, and the end clock runs on simulation time.
binary = "PoseidonGame"
data_dir = "packages/RemasterUD"
no_autotest = true
tags = ["ui", "guerrilla", "remaster_ud", "headless"]
timeout = 300
assert_timeout = 180
extra_args = ["--dev", "--focus"]
