tags = ["ui", "guerrilla", "full_cwa", "headful"]
binary = "PoseidonGame"
mission = "tests/integration/missions/guerrilla_native.abel"
# Boot + manager boot writes, then the real map display and nine captures.
timeout = 240
assert_timeout = 90
# Windowed 1440x1080: the second, higher-resolution 4:3 capture. 1600x1200 is
# NOT used because a 1080p desktop clamps it silently; 1440x1080 fits. Left
# unset, --display-mode defaults to borderless (the .sqf asserts the shape).
extra_args = ["--dev", "--window", "--display-mode", "windowed", "--width", "1440", "--height", "1080"]
