# Menu-time faction gating + faction pack on Abel (issue #54 A2/E2). Boots to
# the main menu (no mission=) with two repo fixture packs mounted through
# absolute ${repo_root}/... paths (tri expands the token to the engine
# checkout root). Needs the templates + shared core + faction library
# installed in the game dir (guerrilla-mode/install-missions.ps1). No @LoBo.
binary = "PoseidonGame"
tags = ["ui", "guerrilla", "full_cwa", "headless"]
timeout = 300
assert_timeout = 180
extra_args = ["--dev", "--mods-dir", ".", "--mod", "${repo_root}/tests/fixtures/mods-factionpack/@udfaction;${repo_root}/tests/fixtures/mods-factionpack/@udbroken"]
