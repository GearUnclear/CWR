# RISK PROBE (diagnostic): stale _bodySel across an island switch, plus the
# Guerrilla.Abel addOns[] gate. Copy of guerrilla_character_lobo_e2e.test.toml
# preconditions: templates installed via
#   guerrilla-mode/install-missions.ps1
