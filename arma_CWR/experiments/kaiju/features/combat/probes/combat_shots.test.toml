# Dedushka COMBAT, a photo run: hits, wound stages by day and night, the death (experiment, kept
# out of tests/integration and out of the combat gate). Nothing fires. Needs <git root>/tmp/@kj_combat and the kaiju
# engine build. Run it through
#   run-combat.ps1 -Probe -Name combat_shots
tags = ["kaiju", "experiment", "combat", "probe"]
binary = "PoseidonGame"
mission = "experiments/kaiju/features/combat/KjCombat.Eden"
timeout = 900
assert_timeout = 300
extra_args = ["--nosound", "--no-strict", "--width", "1280", "--height", "720", "--mods-dir", "..", "--mod", "@kj_combat"]
