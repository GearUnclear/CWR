# Dedushka beam test (experiment, kept out of tests/integration so a sweep never
# runs it). Needs @uddedushka (the creature) and @kj_beam (features/beam/addon/
# build-kjbeam.ps1) beside the data dir. Run it through features/beam/run-beam.ps1:
# one game, hidden desktop, --render gl33. Quiet: nobody fires, all damage is scripted.
tags = ["kaiju", "experiment", "beam"]
binary = "PoseidonGame"
mission = "experiments/kaiju/features/beam/KaijuBeam.Eden"
timeout = 420
assert_timeout = 120
extra_args = ["--nosound", "--no-strict", "--width", "1600", "--height", "900", "--mods-dir", "..", "--mod", "@uddedushka;@kj_beam"]
